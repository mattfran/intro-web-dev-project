<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Star Bakery - Contact</title>
</head>
<body>
  <header>
    <img src="assets/images/bakery-logo_c.png" alt="North Star Bakery logo">
    <h1>ContactUs</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h2>Inquiry and Pre-Order Form</h2>
      <form action="#" method="post">
        <fieldset>
          <legend>Your Information</legend>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </fieldset>

        <fieldset>
          <legend>Request Deltails</legend>
          <label for="pickup-date">Pickup date</label>
          <input type="date" id="pickup-date" name="pickup-date" required>

          <label for="request-type">Request type</label>
          <select id="request-type" name="request-type" required>
            <option value="">Please choose ...</option>
            <option value="pre-order">Pre-Order</option>
            <option value="general-question">General Question</option>
          </select>

          <label for="item-details">Item details</label>
          <textarea id="item-details" name="item-details" rows="4" cols="40"></textarea>

          <label for="allergy-notes">Allergy notes (if applicable)</label>
          <textarea id="allergy-notes" name="allergy-notes" rows="3" cols="40"></textarea>
        </fieldset>

        <button type="submit">Send</button>
      </form>
    </section>

    <section>
      <h2>Location</h2>
      <p>123 Fake Street, Springfield</p>
    </section>

    <section>
      <h2>Hours of Operation</h2>
      <p>Monday to Friday: 6:00 AM to 6:00 PM<br>Saturday to Sunday: 7:00 AM to 4:00 PM</p>
    </section>
  </main>

  <footer>
    <p>© 2026 North Star Bakery</p>
  </footer>
</body>
</html>
